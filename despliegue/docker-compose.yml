# Sistema Integral para Colectivos en un servidor (produccion).
#
# Cuatro servicios en la misma red interna de Docker:
#   caddy     unica puerta de entrada (80 y 443). Pide y renueva solo el
#             certificado HTTPS, entrega las tres apps web (construidas con
#             web/Dockerfile) y pasa /api/* a la API.
#   api       NestJS, construida con api/Dockerfile.
#   postgres  datos con integridad referencial.
#   mongo     posiciones GPS, avisos de espera y auditoria.
#
# Las bases NO publican puertos: desde internet solo se llega a Caddy.
# Cada base tiene dos cuentas: la duena (*_USUARIO), que solo usan los
# scripts de inicio, los respaldos y el cambio de clave demo, y la de la
# API (*_API_USUARIO), con permisos minimos: en PostgreSQL sin DELETE,
# TRUNCATE ni cambios de estructura; en MongoDB sin borrar la auditoria.
#
# Uso (desde esta carpeta, con el .env creado por ./generar-env.sh):
#   docker compose up -d --build
#   docker compose ps

name: colectivos

x-registros: &registros
  # Limita los registros de cada contenedor para no llenar el disco.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: colectivos
      POSTGRES_USER: ${POSTGRES_USUARIO:?Falta POSTGRES_USUARIO en .env}
      POSTGRES_PASSWORD: ${POSTGRES_CONTRASENA:?Falta POSTGRES_CONTRASENA en .env}
      # Las lee bd/postgres/inicio/03_cuenta_api.sql
      POSTGRES_API_USUARIO: ${POSTGRES_API_USUARIO:?Falta POSTGRES_API_USUARIO en .env}
      POSTGRES_API_CONTRASENA: ${POSTGRES_API_CONTRASENA:?Falta POSTGRES_API_CONTRASENA en .env}
      TZ: America/Santiago
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ../bd/postgres/inicio:/docker-entrypoint-initdb.d:ro
    # Se consulta por el nombre del servicio y no por localhost: durante la
    # primera carga de datos el servidor temporal solo escucha en local, asi
    # que la base aparece sana recien cuando la API ya puede conectarse.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U \"$$POSTGRES_USER\" -d colectivos"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *registros

  mongo:
    image: mongo:7
    restart: unless-stopped
    # En un servidor de 4 GB, MongoDB tomaria por defecto 1,5 GB de cache.
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_DATABASE: colectivos
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USUARIO:?Falta MONGO_USUARIO en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_CONTRASENA:?Falta MONGO_CONTRASENA en .env}
      # Las lee bd/mongo/inicio/02_cuenta_api.js
      MONGO_API_USUARIO: ${MONGO_API_USUARIO:?Falta MONGO_API_USUARIO en .env}
      MONGO_API_CONTRASENA: ${MONGO_API_CONTRASENA:?Falta MONGO_API_CONTRASENA en .env}
      TZ: America/Santiago
    volumes:
      - datos_mongo:/data/db
      - ../bd/mongo/inicio:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "mongo", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *registros

  api:
    build: ../api
    image: colectivos-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUERTO: 3000
      # La API entra solo con sus cuentas de permisos minimos.
      URL_POSTGRES: postgresql://${POSTGRES_API_USUARIO}:${POSTGRES_API_CONTRASENA}@postgres:5432/colectivos
      URL_MONGO: mongodb://${MONGO_API_USUARIO}:${MONGO_API_CONTRASENA}@mongo:27017/colectivos?authSource=colectivos
      SECRETO_JWT: ${SECRETO_JWT:?Falta SECRETO_JWT en .env}
      # 100 peticiones por minuto por IP. Solo se sube durante una prueba de
      # carga (pruebas/README.md) y se vuelve a 100 al terminar.
      LIMITE_GENERAL_POR_MINUTO: ${LIMITE_GENERAL_POR_MINUTO:-100}
      TZ: America/Santiago
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    logging: *registros

  caddy:
    # Caddy con las tres apps web ya compiladas (ver web/Dockerfile).
    build: ../web
    image: colectivos-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - datos_caddy:/data
      - config_caddy:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *registros

  # Solo para demostraciones: mueve colectivos de prueba por el recorrido
  # (posiciones GPS y asientos simulados). No parte con "docker compose up":
  # se pide con --profile demo. Ver pruebas/simulador/README.md.
  simulador:
    profiles: [demo]
    image: node:24-slim
    restart: "no"
    init: true
    user: node
    working_dir: /simulador
    command: ["node", "simular-colectivos.mjs"]
    # Al detenerlo cierra las jornadas y desactiva sus autos: le da tiempo.
    stop_grace_period: 30s
    volumes:
      - ../pruebas/simulador:/simulador:ro
    environment:
      # Habla con la API por la red interna de Docker: no pasa por Caddy ni
      # gasta el limite de peticiones por IP de quien presenta.
      BASE_URL: http://api:3000
      CLAVE_DEMO: ${CLAVE_DEMO:-}
      TRAZADO: ${SIMULADOR_TRAZADO:-9001}
      # Usa autos SIMU01.. y conductores sim<codigo>-N@ propios, que crea con
      # este representante; las cuentas de la demo quedan libres.
      REPRESENTANTE: ${SIMULADOR_REPRESENTANTE:-representante@colectivos.ejemplo.cl}
      AUTOS: ${SIMULADOR_AUTOS:-3}
      DURACION_MIN: ${SIMULADOR_DURACION_MIN:-240}
      TZ: America/Santiago
    depends_on:
      api:
        condition: service_healthy
    logging: *registros

volumes:
  datos_postgres:
  datos_mongo:
  datos_caddy:
  config_caddy:
