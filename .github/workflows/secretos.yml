# Busca contrasenas, tokens y claves en todo el historial del repositorio
# (gitleaks). Corre en cada pull request hacia main y en cada cambio que
# entra a main; si encuentra algo, el pull request queda en rojo.
# Parte de la base del repositorio.

name: Secretos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretos:
    name: Busqueda de secretos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Descargar el codigo con todo el historial
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Revisa todos los commits: una clave subida por error queda en el
      # historial aunque despues se borre del archivo.
      - name: Buscar contrasenas, tokens y claves en el historial
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
